name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/cool-hawking-u9zv13
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancel in-progress runs for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Served at the root of www.bluesunsvcs.com (see public/CNAME), so no
      # base path: every asset URL is root-relative. Previously this built
      # with PAGES_BASE_PATH=/BlueSun for the github.io/BlueSun subpath —
      # setting either variable again would prefix every asset with /BlueSun
      # and the site would load without styling or video.
      - name: Build static site
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
